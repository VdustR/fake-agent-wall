name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps a release PR open against main. Merging it tags the version and cuts
  # the GitHub Release; only then do the platform builds run.
  please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: please
    if: needs.please.outputs.released == 'true'
    permissions:
      contents: write
    strategy:
      # One platform failing must not withhold the others from the release.
      fail-fast: false
      matrix:
        include:
          # Apple silicon runner; it cross-builds the Intel target too.
          - os: macos-14
            platform: --mac
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Unsigned everywhere. On macOS, desktop/after-pack.cjs re-signs the bundle
      # ad-hoc so the signature at least matches its contents; without that macOS
      # calls the app damaged and offers no override.
      - name: Package
        run: pnpm exec electron-builder ${{ matrix.platform }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # electron-builder 26.15's BCJ2 output is not decoded by the bundled
          # Nsis7z plugin, which silently omits Windows executables and DLLs.
          # Keep this until the upstream NSIS extractor supports modern BCJ2.
          ELECTRON_BUILDER_7Z_FILTER: BCJ

      - name: Attach the artifacts to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/*.exe release/*.AppImage release/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no distributables were produced" >&2
            exit 1
          fi
          printf 'uploading %s\n' "${files[@]}"
          gh release upload "${{ needs.please.outputs.tag }}" "${files[@]}" --clobber
