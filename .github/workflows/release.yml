name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps a release PR open against main. Merging it tags the version and cuts
  # the GitHub Release; only then does the mac build run.
  please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  macos:
    needs: please
    if: needs.please.outputs.released == 'true'
    # Apple silicon runner: the app ships arm64 only.
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Unsigned on purpose: there is no Developer ID for this project, and an
      # ad-hoc signature is one Gatekeeper rejects just the same. The README
      # carries the install steps that go with an unsigned build.
      - name: Build macOS app
        run: pnpm app:dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Attach the disk image to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.please.outputs.tag }}" release/*.dmg --clobber
