allowBuilds:
  electron-winstaller: set this to true or false

# electron's postinstall fetches the platform binary, so it must be allowed to
# run. Listing it here implicitly denies every other package's build script.
onlyBuiltDependencies:
  - electron

# electron-builder pulls in electron-winstaller, a Windows-installer builder this
# macOS-only app never needs. Its skipped build is expected, not a failure.
strictDepBuilds: false

# electron-builder's YAML consumers accept v4; keep their merge-budget fix.
overrides:
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'undici@>=6.23.0 <6.29.1': 6.29.1
  'undici@>=7.18.0 <7.30.1': 7.30.1
