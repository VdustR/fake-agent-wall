    <title>Fake Agent Wall — MCR-01</title>
    <meta
      name="description"
      content="A responsive wall of synthetic coding agents for idle screens, videos, livestreams, and presentations. Every session, task, and metric is simulated."

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308090a'/%3E%3Ctext x='16' y='23' font-size='22' text-anchor='middle' fill='%23d97757' font-family='monospace'%3E%E2%9C%BB%3C/text%3E%3C/svg%3E" />

  <body>
    <!--
      THESIS: many agents working at once is a broadcast problem, not a dashboard
      problem. This refuses the card-grid-of-terminals-with-a-stats-header default
      and builds the object that already solves it: a master-control multiviewer.
      OWN-WORLD: graphite rack chrome, hard 1px silkscreen hairlines, tally-lamp
      borders (live red / cue green / hold amber), UMD label strips under every
      source, amber SMPTE timecode, segmented LED meters. No glow-on-black, no
      glass, no rounded cards.
      STORY: a viewer reads "many agents working, one of them on air right now"
      in under two seconds, then finds coherent vendor-neutral agent grammar
      when they look closer.
      LAYOUT: a content-aware mosaic keeps PGM prominent, packs terminal and
      operations blocks around their preferred proportions, and changes source
      capacity with the available container. Large viewports generate more
      synthetic agents instead of stretching a fixed set across empty space.
      FORM: broadcast master-control multiviewer. The panels use product-owned,
      vendor-neutral agent grammar rather than imitating one client.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md.
    -->
    <div id="deck"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
