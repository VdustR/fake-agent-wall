appId: dev.vdustr.fake-agent-wall
productName: Fake Agent Wall
copyright: Fake Agent Wall

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - desktop/**
  - '!desktop/bin/**'
  - '!desktop/native/**'
  - '!desktop/*.test.js'
  - '!desktop/after-pack.cjs'
  - '!desktop/build-native.cjs'
  - package.json

# Re-signs the macOS bundle ad-hoc. Without this the app inherits Electron's
# linker signature, which repacking invalidates, and macOS calls it damaged.
afterPack: desktop/after-pack.cjs

mac:
  category: public.app-category.entertainment
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  darkModeSupport: true
  # No Developer ID exists for this project, so electron-builder must not try to
  # find one. desktop/after-pack.cjs does the ad-hoc signing instead.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    LSUIElement: false
    NSHighResolutionCapable: true

dmg:
  title: ${productName}
  window:
    width: 520
    height: 340

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  icon: build/icon.png
  # fpm requires a Debian maintainer, and it will not fall back to an author
  # without an email address.
  maintainer: ViPro <vdustr@gmail.com>
  category: Graphics
  synopsis: A synthetic coding-agent ambient display
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
